<!-- 1) კომენტარების სახით ახსენით რა არის flexbox და რისთვის გამოიყენება.
 Flexbox არის css განლაგენბის მოდელი რომელიც გამოიყენება ელემენტების სივრცის გასანაწილებლად
-->
<!-- 2) კომენტარების სახით ახსენით რას აკეთებს შემდეგი თვისებები: -->
<!-- - flex-direction row, column, row-reverse, column-reverse; -->
<!-- flex direction აკონტროლებს მიმართულებას რომლითაც შვიოლობილი ელემენტები ლაგდებიან
    row გამოიყენება რომ ელემენტები  განლაგდეს გვერდი გვერდ მარცხნიდან მარჯვნივ
    row-reverse აბრუნებს ელემენტს ჰორიზონტალურად საპირისპირო მიმართულებით
    column reverse აწყობს ელემენტს ვერტიკალიურ სვეტებად ქვემოდან ზემოთ -->
<!-- 4) კომენტარების სახით ახსენით რა არის css reset და რისთვის ვაკეთებთ შესაბამისად? 
 
css reset  არის მეთოდი, რომლითაც ვანულებთ სტანდარტულ სტილებს დაშორებებს  ფონტებს და ზომებს
გამოიყენება იმისთვის რომ იმისათვის, რომ ყველა ბრაუზერში ჩვენი ვებ-გვერდი 
    ერთნაირად და ზუსტად ისე გამოიყურებოდეს, როგორც ჩვენ გვინდა,-->

<!-- 5) კომენტარების სახით ახსენით რა არის box-sizing და რისთვის გამოიყენება? -->
<!-- box-sizing არის CSS-ის თვისება, რომელიც განსაზღვრავს, თუ როგორ უნდა ითვალისწინებდეს ელემენტის სიგანე (width) და სიმაღლე
(height) მის შიდა სივრცეებს (padding) და ჩარჩოებს (border). -->
