<html>

<head>
    <meta charset="UTF-8">
    <title>send us message page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <center>
        <div class="Loginbox">
            <h1 style="color: purple;">send us a message</h1>

            <label for="text">Enter Full Name</label><br>
            <input placeholder="Full Name" id="text" type="text"><br><br>

            <label for="email">Enter email</label><br>
            <input placeholder="email" type="email" id="email"><br><br>

            <label for="phone">enter phone number</label><br>
            <input placeholder=" type phone number" id="phone"><br><br>

            <label for="message">type message</label><br>
            <textarea id="message" name="message" rows="4" cols="50"
                placeholder="Type your message here..."></textarea><br><br>

            <button type="submit">SEND</button>
        </div>
    </center>
</body>



</center>
</body>

</html>
