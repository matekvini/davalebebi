<!-- 1) კომენტარების სახით თქვენი სიტყვებით ახსენით რა დანიშნულება აქვს შემდეგ კუთვნილებებს:
- justify-content
- align-items
- flex-flow
- flex-wrap
- gap -->

<!-- justify content საჭიროა ელემენტების ჰორიზონტალურად გასანაწილებლად ვებ გვერდზე -->
<!-- align items  ასწორებს და აწყობს ელემენტებს ვერტიცალურად (ზემოდან ქვემოთ)  -->
<!-- flex-flow არის ორი რამის გაერთიანება ერთ ხაზში -->
<!-- flex wrap  არის გზა იმის რომ ელემენტები არ გაიჭედონ როცა ადგილი არი არის  -->
<!-- gap აშორებს  ან ტოვებს სივრცეს ელემენტებს შორის რომელიც იზომება px ით -->
